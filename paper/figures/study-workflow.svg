<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 315" role="img" aria-labelledby="title desc">
<title id="title">Randomized access, shared task, separate outcomes</title>
<desc id="desc">Random assignment allows or disables a coding agent. Both groups do the same capped task. Measure patch quality and the same developer&#x27;s delayed unaided transfer separately.</desc>
<rect width="960" height="315" fill="#fff"/>
<text x="28" y="34" fill="#132637" font-family="sans-serif" font-size="22" font-weight="bold">Randomized access, shared task, separate outcomes</text>
<text x="28" y="62" fill="#263d50" font-family="sans-serif" font-size="15">Proposed protocol · No outcome data</text>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#314759"/></marker></defs>
<path d="M173 187 L210 132" stroke="#314759" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M173 189 L210 253" stroke="#314759" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M365 130 L418 171" stroke="#314759" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M365 257 L418 203" stroke="#314759" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M645 173 L709 132" stroke="#314759" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M645 204 L709 253" stroke="#314759" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="28" y="151" width="144" height="75" rx="7" fill="#eef4fa" stroke="#314759" stroke-width="2"/>
<text x="40" y="180" fill="#132637" font-family="sans-serif" font-size="16" font-weight="bold">Randomize</text>
<text x="40" y="203" fill="#243c50" font-family="sans-serif" font-size="13">After baseline</text>
<rect x="214" y="91" width="150" height="75" rx="7" fill="#eef4fa" stroke="#314759" stroke-width="2"/>
<text x="226" y="120" fill="#132637" font-family="sans-serif" font-size="16" font-weight="bold">Agent access</text>
<text x="226" y="143" fill="#243c50" font-family="sans-serif" font-size="13">Generative tool enabled</text>
<rect x="214" y="222" width="150" height="75" rx="7" fill="#eef4fa" stroke="#314759" stroke-width="2"/>
<text x="226" y="251" fill="#132637" font-family="sans-serif" font-size="16" font-weight="bold">No agent</text>
<text x="226" y="274" fill="#243c50" font-family="sans-serif" font-size="13">Same other tools</text>
<rect x="422" y="141" width="222" height="94" rx="7" fill="#eef4fa" stroke="#314759" stroke-width="2"/>
<text x="434" y="170" fill="#132637" font-family="sans-serif" font-size="16" font-weight="bold">Capped maintenance</text>
<text x="434" y="193" fill="#243c50" font-family="sans-serif" font-size="13">Measure active human time</text>
<text x="434" y="211" fill="#243c50" font-family="sans-serif" font-size="13">Track waiting separately</text>
<rect x="713" y="91" width="219" height="75" rx="7" fill="#eef4fa" stroke="#314759" stroke-width="2"/>
<text x="725" y="120" fill="#132637" font-family="sans-serif" font-size="16" font-weight="bold">Same session</text>
<text x="725" y="143" fill="#243c50" font-family="sans-serif" font-size="13">Masked patch assessment</text>
<rect x="713" y="222" width="219" height="75" rx="7" fill="#eef4fa" stroke="#314759" stroke-width="2"/>
<text x="725" y="251" fill="#132637" font-family="sans-serif" font-size="16" font-weight="bold">One week later</text>
<text x="725" y="274" fill="#243c50" font-family="sans-serif" font-size="13">Same person, unaided transfer</text>
</svg>
